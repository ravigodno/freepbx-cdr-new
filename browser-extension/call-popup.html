<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>PBXPuls — звонок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="call-popup-body">
  <main class="call-popup-main compact-call-popup">
    <section class="participants-card single-participant-card">
      <div class="participant single-participant">
        <small id="participantLabel"></small>
        <strong id="source"></strong>
        <div id="participantDetails" class="participant-details"></div>
        <div id="inboundDid" class="inbound-did"></div>
      </div>
    </section>
    <footer class="call-footer compact-footer">
      <span id="extension"></span>
      <div class="call-popup-actions">
        <button id="open" class="compact-action">Открыть PBXPuls</button>
        <button id="blacklist" class="compact-action danger-action" disabled>В ЧС</button>
      </div>
    </footer>
    <div id="callActionStatus" class="call-action-status" role="status"></div>
  </main>
  <script src="call-popup.js"></script>
</body>
</html>
