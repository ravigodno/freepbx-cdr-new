<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>PBXPuls</title><link rel="stylesheet" href="style.css"></head><body><main><h1>PBXPuls</h1><p>Заявки, звонки и вызовы по ссылкам <code>tel:</code>.</p><label>Адрес PBXPuls<input id="baseUrl" placeholder="http://192.168.1.2:3000"></label><label>Логин<input id="username" autocomplete="username"></label><label>Пароль<input id="password" type="password" autocomplete="current-password"></label><div class="buttons"><button id="connect">Подключить</button><button id="testPopup" class="secondary">Проверить окно звонка</button></div><div id="status"></div><div id="diagnostics"></div><small>Пароль не сохраняется. Сессия автоматически продлевается и действует до 180 дней бездействия.</small></main><script src="options.js"></script></body></html>
